<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel - Almacén de Recuerdos</title>

  <!-- Toastify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  
  <link rel="stylesheet" href="styles.css" />
  <script src="scripts.js" defer></script>
</head>
<body>

<header>
  <div class="header-left">
    <h1>✨ Almacén de Recuerdos</h1>
    <p class="muted">Panel de administración</p>
  </div>

  <div class="header-right">
    <label class="switch">
      <input id="dark-toggle" type="checkbox" />
      <span class="slider">🌙</span>
      
    </label>
    <button id="refresh-all" class="btn small">🔄</button>
  </div>
</header>

<nav>
  <button data-tab="articulos" class="active">Artículos</button>
  <button data-tab="categorias">Categorías</button>
  <button data-tab="almacen">Almacén</button>
</nav>

<main>
  <!-- ARTICULOS -->
  <section id="articulos" class="active">
    <div class="toolbar">
      <div>
        <button id="btn-add-articulo" class="btn">➕ Añadir</button>
        <button id="btn-clear-filters-art" class="btn ghost">Limpiar</button>
      </div>
      <input id="search-articulos" placeholder="Buscar por nombre, color, estado..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Precio</th><th>Tamaño</th><th>Color</th>
            <th>Imagen</th><th>Historia</th><th>Disponible</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-articulos"></tbody>
      </table>
    </div>
  </section>

  <!-- CATEGORIAS -->
  <section id="categorias">
    <div class="toolbar">
      <div>
        <button id="btn-add-cat" class="btn">➕ Añadir</button>
        <button id="btn-clear-filters-cat" class="btn ghost">Limpiar</button>
      </div>
      <input id="search-categorias" placeholder="Buscar categoría..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Nombre</th><th>Imagen</th><th>Acciones</th></tr></thead>
        <tbody id="tbody-categorias"></tbody>
      </table>
    </div>
  </section>

  <!-- ALMACÉN -->
  <section id="almacen">
    <div class="toolbar">
      <div>
        <button id="btn-add-almacen" class="btn">➕ Añadir</button>
        <button id="btn-clear-filters-alm" class="btn ghost">Limpiar</button>
      </div>
      <input id="search-almacen" placeholder="Buscar por artículo, categoría, ubicación..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Artículo</th><th>Categoría</th><th>Stock</th><th>Ubicación</th><th>Acciones</th></tr></thead>
        <tbody id="tbody-almacen"></tbody>
      </table>
    </div>
  </section>
</main>
  <footer>
    <p>&copy; 2025 Almacén de Recuerdos - Juan Manuel Mudarra Pozo</p>
  </footer>

<!-- Modal genérico (formulario) -->
<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <button id="modal-close" class="modal-close">×</button>
    <h3 id="modal-title"></h3>
    <form id="modal-form"></form>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirm-modal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <h3>Confirmar eliminación</h3>
    <p id="confirm-text">¿Seguro que quieres eliminar esto?</p>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="btn ghost">Cancelar</button>
      <button id="confirm-accept" class="btn delete">Eliminar</button>
    </div>
  </div>
</div>
</body>
</html>
