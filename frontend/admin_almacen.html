<!-- Frontend de administración conectado al backend Node/Express/MongoDB Atlas -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Almacén Recuerdos</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>

<body>
  <header>
    <h1>Panel de Administración - Almacén Recuerdos</h1>
  </header>
  <nav>
    <button id="tab-articulos" class="active">Artículos</button>
    <button id="tab-categorias">Categorías</button>
    <button id="tab-almacen">Almacén</button>
  </nav>

  <section id="articulos" class="active">
    <h2>Gestión de Artículos</h2>
    <form id="form-articulo">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="number" id="precio" placeholder="Precio">
      <input type="text" id="tamaño" placeholder="Tamaño">
      <input type="text" id="color" placeholder="Color">
      <button type="submit" class="crud">Añadir</button>
    </form>
    <div id="tabla-articulos"></div>
    <!-- <table id="tabla-articulos">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Tamaño</th>
          <th>Color</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table> -->
  </section>

  <section id="categorias">
    <h2>Gestión de Categorías</h2>
    <form id="form-categoria">
      <input type="text" id="nombreCat" placeholder="Nombre" required>
      <button type="submit" class="crud">Añadir</button>
    </form>
    <table id="tabla-categorias">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="almacen">
    <h2>Gestión de Almacén</h2>
    <form id="form-almacen">
      <input type="text" id="articuloId" placeholder="ID Artículo" required>
      <input type="text" id="categoriaId" placeholder="ID Categoría" required>
      <input type="number" id="stock" placeholder="Stock" required>
      <input type="text" id="ubicacion" placeholder="Ubicación">
      <button type="submit" class="crud">Añadir</button>
    </form>
    <table id="tabla-almacen">
      <thead>
        <tr>
          <th>Artículo</th>
          <th>Categoría</th>
          <th>Stock</th>
          <th>Ubicación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

</body></html>
